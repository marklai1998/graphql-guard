name: Test

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  run-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6

      - name: Setup node version
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: ".node-version"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm i --frozen-lockfile

      - name: Lint
        run: pnpm biome check --diagnostic-level=error

      - name: Lint type
        run: pnpm tsc

  run-test:
    name: run-test (graphql ${{ matrix.graphql }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every graphql major in the peer range, plus its lowest supported version.
        # @graphql-tools/schema 11 (used by the tests) needs graphql 16+, so older
        # versions use 10. GraphQL Yoga 6 and Apollo Server 5 need graphql 16+,
        # so the server tests only run there.
        include:
          - graphql: "14.4.0"
            test-deps: "@graphql-tools/schema@10"
            test-args: "--exclude tests/servers.test.ts"
          - graphql: "14"
            test-deps: "@graphql-tools/schema@10"
            test-args: "--exclude tests/servers.test.ts"
          - graphql: "15"
            test-deps: "@graphql-tools/schema@10"
            test-args: "--exclude tests/servers.test.ts"
          - graphql: "16"
          - graphql: "17"
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        name: Install pnpm

      - name: Setup node version
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: ".node-version"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm i --frozen-lockfile

      - name: Use graphql ${{ matrix.graphql }}
        if: matrix.graphql != '17'
        run: pnpm add -D graphql@${{ matrix.graphql }} ${{ matrix.test-deps }}

      - name: Test Code
        run: pnpm test ${{ matrix.test-args }}
