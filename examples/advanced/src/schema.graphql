type Query {
  viewer: Viewer
  products: [Product!]!
}

type Mutation {
  addItemToBasket(productId: ID!, quantity: Int!): Viewer
  removeItemFromBasket(itemId: ID!): Viewer
  addProduct(name: String!, description: String!, price: Int!): Product!
  removeProduct(id: ID!): Product!
}

type Viewer {
  email: String!
  basket: [BasketItem!]!
}

type Product {
  id: ID!
  name: String!
  description: String!
  price: Int!
}

type BasketItem {
  id: ID!
  product: Product!
  quantity: Int!
}
